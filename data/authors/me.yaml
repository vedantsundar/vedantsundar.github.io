bio: |
  I'm an incoming undergraduate student at the California Institute of Technology (Caltech), where I will be pursuing a B.S. in Physics and Mathematics.
  My current research interests include Enumerative Combinatorics and Graph Theory on the Maths side of things, 
  and Particle Physics and Condensed Matter Theory on the Physics side.
  
  I have participated in two major research experiences. In the summer of 2025, I worked at the National Institute of Standards and Technology (NIST) on an ultrasonic detection capacity for Absolute Dosimetry and 
  real-time imaging of absorbed radiation dose (for ultrahigh dose-rate electron beams in FLASH Radiotherapy). 
  The summer before that, I worked at the University of North Texas (UNT) on Anderson localization of acoustic waves in periodic structures with broken P-symmetry. See my Research page for summaries of my research projects in these fields.
  
  I'm also broadly interested in these fields' applications: see my Projects page for other work that I've done in more applied contexts.

  In my free time, I like to play the Mridangam and listen to classical music. I also enjoy reading a good book (and I've found that you usually can't go wrong with classical literature).





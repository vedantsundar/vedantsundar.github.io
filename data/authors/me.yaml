bio: |
  I'm an incoming undergraduate student at the California Institute of Technology (Caltech), where I will be pursuing a B.S. in Physics and Mathematics.
  My current research interests include Enumerative Combinatorics and Graph Theory on the Maths side of things, 
  and Particle and Condensed Matter Theory on the Physics side.
  
  My research experiences include working at the National Institute of Standards and Technology (NIST) on an ultrasonic detection capacity for Absolute Dosimetry and 
  real-time imaging of absorbed radiation dose, and at the University of North Texas (UNT) on Anderson localization of acoustic waves in periodic structures with broken P-symmetry.
  See my Research page for summaries of my work in these fields.
  
  I'm also broadly interested in these fields' applications: see my Projects page for work in more applied contexts.
  And of course, see my Hobbies page for, well, my hobbies!

  Feel free to reach out at vedantsundar1@gmail.com for any personal inquiries.




